<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémania - Início</title>
    <link rel="shortcut icon" type="image/x-icon" href="statics/uploads/utilidade/icon.png" />
    <link rel="stylesheet" type="text/css" href="statics/css/reset.css" />
    <link rel="stylesheet" type="text/css" href="statics/css/estilo.css" />
    <style>
      .inicio-hero {
        text-align: center;
        padding: 60px 20px 30px;
      }
      .inicio-hero img { width: 90px; filter: drop-shadow(0 0 18px rgba(255, 235, 59, 0.6)); }
      .inicio-sub { color: rgba(255, 255, 255, 0.7); font-size: 14px; max-width: 560px; margin: 0 auto 10px; }

      .inicio-stats {
        display: flex;
        gap: 18px;
        justify-content: center;
        flex-wrap: wrap;
        margin: 24px auto 40px;
      }
      .stat-card {
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        border: 2px solid var(--neon-blue);
        border-radius: 16px;
        padding: 22px 30px;
        min-width: 160px;
        box-shadow: 0 0 18px rgba(0, 229, 255, 0.2);
      }
      .stat-card .num { font-size: 2.4rem; font-weight: 900; color: #fff; }
      .stat-card .lbl { font-size: 12px; color: var(--neon-blue); font-weight: bold; text-transform: uppercase; }

      .destaque-box {
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        border: 3px solid var(--pokemon-yellow);
        border-radius: 20px;
        max-width: 560px;
        width: 92%;
        margin: 0 auto 50px;
        padding: 26px;
        text-align: center;
        box-shadow: 0 0 24px rgba(255, 235, 59, 0.18);
      }
      .destaque-box h2 { margin-top: 0; }
      .destaque-box img { width: 150px; height: 150px; object-fit: contain; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5)); }
      .destaque-nome { font-size: 20px; font-weight: 900; color: #fff; margin: 8px 0 4px; }
      .destaque-badges { display: flex; gap: 6px; justify-content: center; margin: 6px 0; }
      .destaque-badges .type-badge {
        font-size: 11px; font-weight: bold; text-transform: uppercase;
        padding: 4px 12px; border-radius: 12px; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
      }
      .destaque-desc { color: rgba(255,255,255,0.75); font-size: 13px; }
      .cta {
        display: inline-block; margin-top: 14px; padding: 14px 30px;
        background: var(--pokemon-yellow); color: #000; font-weight: 900; font-size: 14px;
        border-radius: 12px; text-decoration: none; box-shadow: 0 4px 0 #c8a000; transition: transform 0.15s;
      }
      .cta:hover { transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <div id="site-header"></div>

    <main>
      <section class="inicio-hero">
        <img src="statics/uploads/utilidade/poke-ball.png" alt="Pokébola" />
        <h1>POKÉMANIA</h1>
        <p class="inicio-sub">
          O mundo Pokémon da Supremacia do Protesto. Descubra os Pokémon criados
          pelo mestre, monte sua coleção e sua equipe.
        </p>
      </section>

      <div class="inicio-stats">
        <div class="stat-card">
          <div class="num" id="stat-total">—</div>
          <div class="lbl">Pokémon no mundo</div>
        </div>
        <div class="stat-card">
          <div class="num" id="stat-descobertos">—</div>
          <div class="lbl">Descobertos por você</div>
        </div>
      </div>

      <div class="destaque-box" id="destaque-box">
        <h2>✨ Destaque</h2>
        <div id="destaque-conteudo">
          <p class="destaque-desc">Carregando...</p>
        </div>
      </div>
    </main>

    <script src="statics/js/elementos.js"></script>
    <script src="statics/js/catalogo.js"></script>
    <script src="statics/js/layout.js"></script>
    <script>
      Catalogo.carregar().then(lista => {
        document.getElementById('stat-total').textContent = lista.length;
        const descobertos = lista.filter(p => Catalogo.estaDescoberto(p.numero));
        document.getElementById('stat-descobertos').textContent = descobertos.length;

        const box = document.getElementById('destaque-conteudo');
        if (!descobertos.length) {
          box.innerHTML =
            '<p class="destaque-desc">Você ainda não descobriu nenhum Pokémon. ' +
            'Vá até a <a href="pokedex.html" style="color:var(--pokemon-yellow)">Pokédex</a> ' +
            'e importe o arquivo de liberados que o mestre te enviar.</p>';
          return;
        }
        // Destaque do dia: determinístico pela data, entre os descobertos
        const hoje = new Date();
        const seed = hoje.getFullYear() * 1000 + (hoje.getMonth() + 1) * 50 + hoje.getDate();
        const p = descobertos[seed % descobertos.length];
        const img = p.imagem ? 'statics/uploads/pokemon/' + p.imagem : 'statics/uploads/utilidade/poke-ball.png';
        const badges = (p.elementos || []).map(e =>
          `<span class="type-badge" style="background:${elCor(e)}">${elNome(e)}</span>`
        ).join('');
        box.innerHTML =
          `<img src="${img}" alt="${p.nome}">` +
          `<div class="destaque-nome">${p.nome}</div>` +
          `<div class="destaque-badges">${badges}</div>` +
          `<p class="destaque-desc">${p.descricao || ''}</p>` +
          `<a class="cta" href="pokedex.html">Ver Pokédex →</a>`;
      });
    </script>
  </body>
</html>
