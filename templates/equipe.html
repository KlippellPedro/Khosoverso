<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémania - Equipe</title>
    <link rel="shortcut icon" type="image/x-icon" href="../statics/uploads/utilidade/ultra-ball.png" />
    <script src="../statics/js/tema.js"></script>
    <link rel="stylesheet" type="text/css" href="../statics/css/reset.css" />
    <link rel="stylesheet" type="text/css" href="../statics/css/estilo.css" />
    <link rel="stylesheet" type="text/css" href="../statics/css/pokedex.css" />
    <link rel="stylesheet" type="text/css" href="../statics/css/equipe.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main>
      <div class="pokedex-container">
        <h1>EQUIPE</h1>
        <p class="page-intro" style="margin-bottom: 18px">
          Sua equipe de batalha (até 6). Acompanhe a vida de cada um durante o combate
          e veja as fraquezas do time logo abaixo.
        </p>
        <p id="equipe-contador" class="pokedex-contador">0 / 6</p>

        <div class="add-bar">
          <div class="add-input-wrap">
            <input type="text" id="add-input" placeholder="Adicionar da coleção por nome ou número..." autocomplete="off" />
            <div id="add-sugestoes" class="sugestoes"></div>
          </div>
          <button id="add-btn" class="btn">Adicionar</button>
        </div>

        <div id="equipe-cobertura"></div>
        <section id="equipe-grid" class="equipe-grid"></section>
      </div>
    </main>

    <script src="../statics/js/elementos.js"></script>
    <script src="../statics/js/catalogo.js"></script>
    <script src="../statics/js/menu.js"></script>
    <script src="../statics/js/equipe.js"></script>
  </body>
</html>
