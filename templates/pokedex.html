<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémania - Khosōdex</title>
    <link rel="shortcut icon" type="image/x-icon" href="../statics/uploads/utilidade/ultra-ball.png" />
    <script src="../statics/js/tema.js"></script>
    <link rel="stylesheet" type="text/css" href="../statics/css/reset.css" />
    <link rel="stylesheet" type="text/css" href="../statics/css/estilo.css" />
    <link rel="stylesheet" type="text/css" href="../statics/css/pokedex.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main>
      <div class="pokedex-container">
        <h1>KHOSŌDEX</h1>
        <p id="pokedex-contador" class="pokedex-contador">0 / 0 descobertos</p>

        <div class="busca-container">
          <!-- Importar o JSON de liberados que o mestre distribui -->
          <div class="pokedex-acoes">
            <button id="btn-importar" class="btn-acao">Importar novos Khosōs descobertos</button>
          </div>

          <input type="text" id="pokemon-input" placeholder="Pesquisar nome ou número (entre os descobertos)..." autocomplete="off" />

          <div class="pokedex-filtros">
            <div class="filtro-grupo">
              <select id="filtro-elemento" class="filtro-select">
                <option value="">Todos os elementos</option>
              </select>
              <select id="filtro-geracao" class="filtro-select">
                <option value="">Todas as gerações</option>
              </select>
              <select id="filtro-raridade" class="filtro-select">
                <option value="">Todas as raridades</option>
              </select>
              <button id="btn-limpar" class="btn-limpar">LIMPAR</button>
            </div>
          </div>
        </div>

        <section id="pokedex-list" class="pokedex-grid"></section>
      </div>
    </main>

    <input type="file" id="import-file" accept=".json" hidden />

    <script src="../statics/js/elementos.js"></script>
    <script src="../statics/js/catalogo.js"></script>
    <script src="../statics/js/menu.js"></script>
    <script src="../statics/js/pokedex.js"></script>
  </body>
</html>
